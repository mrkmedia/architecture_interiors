<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jibu and Thomas Architects</title>

    <!-- Font Awesome (kept, optional) -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <!-- Logo -->
    <div class="logo">
        <span class="jt">logo</span>
        <h1>JIBU AND THOMAS</h1>
        <h2>ARCHITECTS</h2>
        <p>Architecture | Interiors | P.M.C</p>
    </div>

    <!-- Location -->
    <div class="icon-section">
        <a href="https://maps.app.goo.gl/pH5wHBNMv2Jym2rm9"
           target="_blank"
           class="icon-link">
            <div class="circle">
                <img src="location.png" class="location-png" alt="Location">
            </div>
            <span class="label">Find us here</span>
        </a>
    </div>

    <!-- Website -->
    <div class="icon-section">
        <a href="https://jibuandthomas.com/"
           target="_blank"
           class="icon-link">
            <div class="circle">
                <img src="website.png" class="website-png" alt="Website">
            </div>
            <span class="label">Visit our website</span>
        </a>
    </div>

    <!-- Description -->
    <p class="description">
        Connect with us here to explore our work values,
        and services in detail.
    </p>

    <!-- Social Icons -->
    <div class="socials">

        <a href="https://www.instagram.com/jibu.and.thomas.architects/"
           target="_blank"
           class="social-link">
            <div class="circle small">
                <img src="instagram.png" class="social-png" alt="Instagram">
            </div>
        </a>

        <a href="https://www.facebook.com/profile.php?id=100064257690126"
           target="_blank"
           class="social-link">
            <div class="circle small">
                <img src="facebook.png" class="social-png" alt="Facebook">
            </div>
        </a>

        <a href="https://wa.me/917907114319"
           target="_blank"
           class="social-link">
            <div class="circle small">
                <img src="whatsapp.png" class="social-png" alt="WhatsApp">
            </div>
        </a>

    </div>

</div>

</body>
</html>
